name: Build ChildQuizUnlock APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q ChildQuizUnlock_source_v0.1.0.zip

      - name: Build APK
        run: gradle -p ChildQuizUnlock assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChildQuizUnlock-debug-APK
          path: ChildQuizUnlock/app/build/outputs/apk/debug/app-debug.apk
